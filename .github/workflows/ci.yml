name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all raw JSON files are well-formed
        run: |
          for file in $(find data/raw -name "*.json"); do
            echo "Validating $file"
            python3 -m json.tool "$file" > /dev/null
          done